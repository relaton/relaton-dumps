name: export

# The fleet walk: one flavor per export (budget-shaped reads, no
# full-corpus sync). Dispatch with a flavor id, or "all" to walk the API's
# flavor list sequentially. Exports are idempotent per generation and skip
# unchanged datasets.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor id (e.g. iso, rfc) or "all"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: export-fleet
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export flavor(s)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE: https://data.relaton.org
          API: https://api-relaton-org.relaton.workers.dev
        run: |
          FLAVOR="${{ inputs.flavor }}"
          export_one() {
            echo "=== exporting $1"
            CURSOR=""
            DONE=false
            for i in $(seq 1 200); do
              RESP=$(curl -sf --max-time 1800 -X POST \
                -H "Authorization: Bearer $ADMIN_TOKEN" \
                -H "content-type: application/json" \
                -d "{\"cursor\":\"$CURSOR\"}" \
                "$BASE/admin/export/$1") || { echo "export failed: $1"; return 1; }
              DONE=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(str(json.load(sys.stdin).get('done', False)).lower())")
              CURSOR=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('next_cursor') or '')")
              echo "  slice: done=$DONE records=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('records', 0))")"
              [ "$DONE" = "true" ] && break
            done
            echo
          }
          if [ "$FLAVOR" != "all" ]; then
            export_one "$FLAVOR"
          else
            FLAVORS=$(curl -sf "$API/v3/flavors" | python3 -c "import json,sys; [print(f.get('flavor') or '') for f in json.load(sys.stdin).get('flavors', [])]")
            for f in $FLAVORS; do
              export_one "$f" || echo "export failed: $f"
            done
          fi

# Dispatch: gh workflow run export.yml -f flavor=all
